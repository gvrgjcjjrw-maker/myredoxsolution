    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sort-of-Works Quiz — My Redox Solution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://embed.typeform.com/next/css/widget.css">
    <style>
        :root {
            --primary: #2a7d7b;
            --hero-bg: #1c2a35;
            --canvas: #ffffff;
            --charcoal: #37352f;
            --stone: #a4a097;
            --on-dark: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif;
            background: var(--canvas);
            color: var(--charcoal);
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: var(--hero-bg);
            padding: 16px 24px;
            text-align: center;
        }

        .top-bar-brand {
            font-family: 'Lora', Georgia, serif;
            color: var(--on-dark);
            font-size: 16px;
            font-weight: 600;
            opacity: 0.9;
        }

        .quiz-embed {
            flex: 1;
            height: calc(100vh - 140px);
            min-height: 520px;
        }

        .quiz-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            padding: 16px 24px 20px;
            text-align: center;
        }

        .footer p {
            font-size: 12px;
            color: var(--stone);
            line-height: 1.6;
            max-width: 640px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="top-bar-brand">My Redox Solution</span>
    </div>

    <div id="quiz-embed" class="quiz-embed"></div>

    <footer class="footer">
        <p>These statements have not been evaluated by the Food and Drug Administration. This product is not intended to diagnose, treat, cure, or prevent any disease.</p>
    </footer>

    <script src="https://embed.typeform.com/next/embed.js"></script>
    <script>
    (function() {
        var started = false;
        function trackStart() {
            if (started) return;
            started = true;
            if (window.fbq) fbq('trackCustom', 'QuizStart');
            if (window.gtag) gtag('event', 'quiz_start');
        }
        window.tf.createWidget('r6dYQq5U', {
            container: document.getElementById('quiz-embed'),
            inlineOnMobile: true,
            onStarted: trackStart,
            onQuestionChanged: trackStart,
            onSubmit: function() {
                if (window.fbq) {
                    fbq('track', 'Lead');
                    fbq('trackCustom', 'QuizComplete');
                }
                if (window.gtag) gtag('event', 'quiz_complete');
            }
        });
    })();
    </script>

</body>
</html>
